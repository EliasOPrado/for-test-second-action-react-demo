name: Events Demo 1
on: 
    push:
        branches:
            - main
            - dev
    pull_request:
        types:
            - opened
    workflow_dispatch:
    
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Output event data
              run: |
                    echo "Event name: ${{ github.event_name }}"
                    echo "Event payload: ${{ toJson(github.event) }}"
            - name: Get code
              uses: actions/checkout@v3
            - name: Install dependencies
              run: npm ci
            - name: Test code
              run: npm run test
            - name: Build code
              run: npm run build
            - name: Deploy code
              run: echo "Deploying to production..." # Replace with your deployment command